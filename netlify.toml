# Netlify configuration for EasyPDF
# Netlify serves "jpg-to-pdf.html" at the clean URL "/jpg-to-pdf" automatically,
# so the canonical URLs in each page match what visitors and Google actually see.

[build]
  publish = "."

# Long cache for static assets (they are versioned by content rarely changing).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Sensible security headers. Good practice, and Google treats HTTPS + safe
# headers as a small positive signal.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# If someone lands on the old .html URL, send them to the clean one so you
# never have two URLs serving identical content (duplicate content penalty).
[[redirects]]
  from = "/jpg-to-pdf.html"
  to = "/jpg-to-pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf-to-jpg.html"
  to = "/pdf-to-jpg"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
